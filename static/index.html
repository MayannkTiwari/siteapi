<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SiteAPI</title>
<style>
  :root {
    --bg: #eef2f5; --panel: #ffffff; --ink: #14212e; --muted: #5b6b7a;
    --line: #d5dde4; --accent: #0b6e75; --accent-ink: #ffffff;
    --log-bg: #0f1a24; --log-ink: #cfe3ee; --err: #b3261e; --ok: #1b7f4b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c141c; --panel: #131f2b; --ink: #e6eef4; --muted: #8ea0b0;
      --line: #25364a; --accent: #3fb6bd; --accent-ink: #06222a;
      --log-bg: #08111a; --log-ink: #b9d3e2; --err: #ff8a80; --ok: #6fd6a0;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif; }
  header { padding: 28px 24px 8px; max-width: 1180px; margin: 0 auto; }
  h1 { margin: 0; font-size: 28px; letter-spacing: -0.02em; }
  header p { margin: 6px 0 0; color: var(--muted); max-width: 62ch; }
  main { max-width: 1180px; margin: 0 auto; padding: 16px 24px 48px; }
  #view-build { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 20px; }
  @media (max-width: 860px) { #view-build { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
  h2 { margin: 0 0 12px; font-size: 17px; }
  h3 { margin: 18px 0 8px; font-size: 15px; }
  label { display: block; font-weight: 600; margin: 12px 0 4px; }
  .hint { color: var(--muted); font-weight: 400; font-size: 13px; }
  input, textarea { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 6px;
    background: transparent; color: var(--ink); font: inherit; }
  textarea { min-height: 84px; resize: vertical; }
  input:focus-visible, textarea:focus-visible, button:focus-visible, summary:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
  button { padding: 9px 16px; border-radius: 6px; border: 1px solid var(--line); background: transparent;
    color: var(--ink); font: inherit; font-weight: 600; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  a { color: var(--accent); }
  .examples { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .examples button { font-weight: 500; font-size: 13px; padding: 4px 10px; }
  #log { background: var(--log-bg); color: var(--log-ink); border-radius: 8px; padding: 12px;
    font: 13px/1.5 ui-monospace, "Cascadia Code", Consolas, monospace; max-height: 220px; overflow: auto;
    white-space: pre-wrap; margin-top: 14px; display: none; }
  #log .err { color: #ff9d94; }
  #live { display: none; width: 100%; height: 280px; border: 1px solid var(--line); border-radius: 8px; margin-top: 12px; }
  #status, #ep-status, #save-status { margin-top: 10px; min-height: 1.4em; color: var(--muted); }
  .err-text { color: var(--err); }
  .ok-text { color: var(--ok); }
  .ep { border-top: 1px solid var(--line); padding: 12px 0; }
  .ep:first-of-type { border-top: 0; }
  .ep h3 { margin: 0; font-size: 15px; }
  .ep code { display: block; margin: 4px 0; font: 12px ui-monospace, Consolas, monospace; color: var(--accent); word-break: break-all; }
  .ep p { margin: 2px 0 8px; color: var(--muted); font-size: 13px; }
  .ep button { font-size: 12.5px; padding: 4px 10px; }
  .empty { color: var(--muted); }

  /* results view */
  #view-results section { max-width: 980px; margin: 0 auto; }
  .topbar { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  #res-title { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
  #res-sub { margin: 0 0 16px; color: var(--muted); }
  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { padding: 10px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
  th { font-weight: 600; background: var(--bg); white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  .cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  dl.kv { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; }
  dl.kv dt { color: var(--muted); }
  dl.kv dd { margin: 0; overflow-wrap: anywhere; }
  ul.plain { margin: 0; padding-left: 20px; }
  .muted { color: var(--muted); }
  .save-box { margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--line); }
  .save-box .row { margin-top: 8px; }
  .save-box input { max-width: 320px; }
  details { margin-top: 18px; }
  summary { cursor: pointer; font-weight: 600; }
  pre.json { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px;
    overflow: auto; max-height: 340px; margin: 10px 0 0; font: 13px/1.5 ui-monospace, Consolas, monospace; }
</style>
</head>
<body>
<header>
  <h1>SiteAPI</h1>
  <p>Enter a URL and describe the data you need. An agent opens the site in a real browser, collects it, and returns JSON you can call by URL.</p>
</header>

<main id="view-build">
  <section aria-labelledby="build-h">
    <h2 id="build-h">Build an endpoint</h2>

    <label for="url">Website</label>
    <input id="url" type="url" placeholder="https://example.com/pricing">

    <label for="goal">What should the API return? <span class="hint">Use {{name}} for values callers can pass in.</span></label>
    <textarea id="goal" placeholder="List every plan with its name, monthly price and main features."></textarea>

    <div class="examples" id="examples"></div>

    <div class="row">
      <button class="primary" id="run">Get data</button>
    </div>
    <div id="status" role="status"></div>

    <iframe id="live" title="Live agent browser"></iframe>
    <div id="log" aria-live="polite"></div>
  </section>

  <section aria-labelledby="eps-h">
    <h2 id="eps-h">Your endpoints</h2>
    <div id="endpoints"><p class="empty">Nothing saved yet. Get some data, then save it as an endpoint.</p></div>
    <div id="ep-status" role="status"></div>
  </section>
</main>

<main id="view-results" hidden>
  <section aria-labelledby="res-title">
    <div class="topbar">
      <button id="back">Back to search</button>
      <span class="muted" id="res-meta"></span>
    </div>

    <h2 id="res-title">Results</h2>
    <p id="res-sub"></p>

    <div id="res-body"></div>

    <div class="row" id="res-actions">
      <button id="csv" hidden>Download as spreadsheet (CSV)</button>
      <button id="copy-raw">Copy raw data</button>
    </div>

    <div class="save-box" id="save-box">
      <label for="name">Name for this endpoint <span class="hint">Becomes the address /v1/your-name</span></label>
      <div class="row">
        <input id="name" type="text" placeholder="hacker-news-top">
        <button class="primary" id="save">Save endpoint</button>
      </div>
      <div id="save-status" role="status"></div>
    </div>

    <details>
      <summary>Show raw data</summary>
      <pre class="json" id="raw"></pre>
    </details>
  </section>
</main>

<script>
const $ = (s) => document.querySelector(s);
const EXAMPLES = [
  { name: "hacker-news-top", url: "https://news.ycombinator.com", goal: "Return the top 5 stories as a list of objects with title, points and link." },
  { name: "tinyfish-pricing", url: "https://www.tinyfish.ai", goal: "Find the pricing plans and return name, price and included credits for each." },
];
const state = { data: null, url: "", goal: "", name: "", slug: null };

/* ---------- small helpers ---------- */
function setText(sel, msg, cls) {
  const el = $(sel);
  el.textContent = msg;
  el.className = cls || "";
}
const isObj = (v) => v !== null && typeof v === "object" && !Array.isArray(v);
const isUrl = (v) => typeof v === "string" && /^https?:\/\/\S+$/.test(v.trim());
function normalizeUrl(u) {
  u = u.trim();
  return u && !/^https?:\/\//i.test(u) ? "https://" + u : u;
}
function humanize(key) {
  return String(key).replace(/[_-]+/g, " ").replace(/([a-z])([A-Z])/g, "$1 $2").replace(/^./, (c) => c.toUpperCase());
}
function host(u) {
  try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return u; }
}
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

/* ---------- turn data into something a person can read ---------- */
function valueNode(v, depth) {
  if (v === null || v === undefined || v === "") return el("span", "muted", "Not available");
  if (typeof v === "boolean") return el("span", "", v ? "Yes" : "No");
  if (isUrl(v)) {
    const a = el("a", "", "Open " + host(v));
    a.href = v.trim(); a.target = "_blank"; a.rel = "noopener noreferrer";
    return a;
  }
  if (Array.isArray(v) && v.every((x) => x === null || typeof x !== "object")) {
    return el("span", "", v.map((x) => (x === null ? "Not available" : String(x))).join(", "));
  }
  if (typeof v === "object") return renderBlock(v, (depth || 0) + 1);
  return el("span", "", String(v));
}

function columnsOf(items) {
  const cols = [];
  for (const it of items) for (const k of Object.keys(it)) if (!cols.includes(k)) cols.push(k);
  return cols;
}

function renderTable(items) {
  const cols = columnsOf(items);
  const wrap = el("div", "table-wrap");
  const t = el("table");
  const head = el("tr");
  for (const c of cols) head.appendChild(el("th", "", humanize(c)));
  const thead = el("thead"); thead.appendChild(head); t.appendChild(thead);
  const tb = el("tbody");
  for (const it of items) {
    const tr = el("tr");
    for (const c of cols) { const td = el("td"); td.appendChild(valueNode(it[c], 1)); tr.appendChild(td); }
    tb.appendChild(tr);
  }
  t.appendChild(tb); wrap.appendChild(t);
  return wrap;
}

function renderKV(obj, depth) {
  const dl = el("dl", "kv");
  for (const [k, v] of Object.entries(obj)) {
    dl.appendChild(el("dt", "", humanize(k)));
    const dd = el("dd"); dd.appendChild(valueNode(v, depth)); dl.appendChild(dd);
  }
  return dl;
}

function renderCards(items) {
  const box = el("div", "cards");
  for (const it of items) { const c = el("div", "card"); c.appendChild(renderKV(it, 1)); box.appendChild(c); }
  return box;
}

function renderBlock(data, depth) {
  depth = depth || 0;
  if (Array.isArray(data)) {
    if (!data.length) return el("p", "muted", "Nothing was found.");
    if (data.every(isObj)) return columnsOf(data).length <= 4 ? renderTable(data) : renderCards(data);
    const ul = el("ul", "plain");
    for (const x of data) { const li = el("li"); li.appendChild(valueNode(x, depth)); ul.appendChild(li); }
    return ul;
  }
  if (isObj(data)) {
    const box = el("div");
    const simple = {}, complex = [];
    for (const [k, v] of Object.entries(data)) {
      if (v !== null && typeof v === "object" && !(Array.isArray(v) && v.every((x) => x === null || typeof x !== "object"))) complex.push([k, v]);
      else simple[k] = v;
    }
    if (Object.keys(simple).length) box.appendChild(renderKV(simple, depth));
    for (const [k, v] of complex) {
      const count = Array.isArray(v) ? " (" + v.length + ")" : "";
      box.appendChild(el("h3", "", humanize(k) + count));
      box.appendChild(renderBlock(v, depth + 1));
    }
    return box;
  }
  const p = el("p"); p.appendChild(valueNode(data, depth));
  return p;
}

function findTable(data) {
  if (Array.isArray(data) && data.length && data.every(isObj)) return data;
  if (isObj(data)) {
    const arrays = Object.values(data).filter((v) => Array.isArray(v) && v.length && v.every(isObj));
    if (arrays.length === 1) return arrays[0];
  }
  return null;
}

function toCSV(items) {
  const cols = columnsOf(items);
  const cell = (v) => {
    const s = v === null || v === undefined ? "" : typeof v === "object" ? JSON.stringify(v) : String(v);
    return '"' + s.replace(/"/g, '""') + '"';
  };
  return [cols.map(humanize).map(cell).join(",")].concat(items.map((it) => cols.map((c) => cell(it[c])).join(","))).join("\r\n");
}

/* ---------- views ---------- */
function showBuild() {
  $("#view-results").hidden = true;
  $("#view-build").hidden = false;
  window.scrollTo(0, 0);
}

function showResults(opts) {
  Object.assign(state, opts);
  const data = state.data;

  $("#res-title").textContent = "Here is what we found";
  $("#res-sub").textContent = "Collected from " + host(state.url) + ". You asked: " + state.goal;
  $("#res-meta").textContent = opts.source === "cache" ? "Saved result" : "Live from the website";

  const body = $("#res-body");
  body.innerHTML = "";
  const rows = findTable(data);
  if (rows) body.appendChild(el("p", "muted", rows.length + (rows.length === 1 ? " item found" : " items found")));
  body.appendChild(renderBlock(data));

  $("#csv").hidden = !rows;
  $("#raw").textContent = JSON.stringify(data, null, 2);
  $("#save-box").hidden = !opts.canSave;
  $("#name").value = state.name || "";
  setText("#save-status", "");

  $("#view-build").hidden = true;
  $("#view-results").hidden = false;
  window.scrollTo(0, 0);
}

/* ---------- agent run ---------- */
function logLine(text, isErr) {
  const log = $("#log");
  log.style.display = "block";
  const line = document.createElement("div");
  if (isErr) line.className = "err";
  line.textContent = text;
  log.appendChild(line);
  log.scrollTop = log.scrollHeight;
}

function describe(ev) {
  const parts = [ev.type, ev.message || ev.purpose || ev.action || ev.status].filter(Boolean);
  return parts.length ? parts.join(": ") : JSON.stringify(ev).slice(0, 200);
}

let pending = null;
function handleEvent(ev) {
  for (const k of ["streamingUrl", "streaming_url", "browserUrl", "liveUrl"]) {
    if (typeof ev[k] === "string" && ev[k].startsWith("http")) {
      const f = $("#live"); f.src = ev[k]; f.style.display = "block";
    }
  }
  if (ev.type === "SITEAPI_RESULT") { pending = ev.data; return; }
  const isErr = String(ev.type).toUpperCase() === "ERROR";
  logLine(describe(ev), isErr);
  if (isErr) setText("#status", ev.message || "The agent run failed.", "err-text");
}

async function runAgent() {
  const url = normalizeUrl($("#url").value);
  const goal = $("#goal").value.trim();
  if (!url || !goal) return setText("#status", "Add a website and a goal first.", "err-text");
  $("#url").value = url;
  if (/\{\{\w+\}\}/.test(goal)) {
    return setText("#status", "For a first run, replace {{placeholders}} with a real value. They work on saved endpoints.", "err-text");
  }

  $("#log").innerHTML = "";
  $("#log").style.display = "none";
  $("#live").style.display = "none";
  $("#run").disabled = true;
  pending = null;
  setText("#status", "The agent is working on the live site...");

  try {
    const res = await fetch("/api/test", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url, goal }),
    });
    if (!res.ok) throw new Error("Server returned " + res.status);
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const chunk = buf.slice(0, i);
        buf = buf.slice(i + 2);
        if (chunk.startsWith("data:")) {
          try { handleEvent(JSON.parse(chunk.slice(5))); } catch (e) { /* skip bad chunk */ }
        }
      }
    }
    if (pending !== null) {
      setText("#status", "");
      const ex = EXAMPLES.find((e) => e.url === url && e.goal === goal);
      showResults({ data: pending, url, goal, canSave: true, source: "live", slug: null, name: ex ? ex.name : "" });
    } else if (!$("#status").textContent) {
      setText("#status", "The agent finished without returning data. Try rewording the goal.", "err-text");
    }
  } catch (e) {
    setText("#status", "Could not reach the SiteAPI server (" + e.message + "). Check that the terminal running uvicorn is still open and that you opened http://127.0.0.1:8000 in the browser.", "err-text");
  } finally {
    $("#run").disabled = false;
  }
}

/* ---------- saving and saved endpoints ---------- */
async function saveEndpoint() {
  const name = $("#name").value.trim();
  if (!name) return setText("#save-status", "Give the endpoint a name first.", "err-text");
  const res = await fetch("/api/endpoints", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name, url: state.url, goal: state.goal, sample: state.data }),
  });
  if (!res.ok) return setText("#save-status", "Could not save the endpoint.", "err-text");
  const ep = await res.json();
  setText("#save-status", "Saved. Anyone can now call " + location.origin + "/v1/" + ep.slug, "ok-text");
  loadEndpoints();
}

function curlFor(ep) {
  const qs = ep.params.map((p) => p + "=VALUE").join("&");
  return `curl "${location.origin}/v1/${ep.slug}${qs ? "?" + qs : ""}"`;
}

async function callEndpoint(ep, btn) {
  let qs = "";
  if (ep.params.length) {
    const vals = ep.params.map((p) => [p, prompt("Value for " + p + "?") || ""]);
    qs = "?" + new URLSearchParams(vals).toString();
  }
  btn.disabled = true;
  const old = btn.textContent;
  btn.textContent = "Running...";
  setText("#ep-status", "");
  try {
    const res = await fetch(`/v1/${ep.slug}${qs}`);
    const body = await res.json();
    if (!res.ok) throw new Error(body.detail || "Request failed");
    showResults({ data: body.data, url: ep.url, goal: ep.goal, canSave: false, source: body.source, slug: ep.slug, name: ep.slug });
  } catch (e) {
    setText("#ep-status", "Could not run " + ep.slug + ": " + e.message, "err-text");
  } finally {
    btn.disabled = false;
    btn.textContent = old;
  }
}

async function loadEndpoints() {
  const box = $("#endpoints");
  const eps = await (await fetch("/api/endpoints")).json();
  box.innerHTML = "";
  if (!eps.length) {
    box.innerHTML = '<p class="empty">Nothing saved yet. Get some data, then save it as an endpoint.</p>';
    return;
  }
  for (const ep of eps) {
    const wrap = el("div", "ep");
    wrap.append(el("h3", "", ep.name), el("code", "", curlFor(ep)), el("p", "", ep.goal));
    const row = el("div", "row"); row.style.marginTop = "6px";
    const run = el("button", "", "Call it");
    run.onclick = () => callEndpoint(ep, run);
    const copy = el("button", "", "Copy curl");
    copy.onclick = async () => { await navigator.clipboard.writeText(curlFor(ep)); copy.textContent = "Copied"; setTimeout(() => (copy.textContent = "Copy curl"), 1200); };
    const del = el("button", "", "Delete");
    del.onclick = async () => { await fetch("/api/endpoints/" + ep.slug, { method: "DELETE" }); loadEndpoints(); };
    row.append(run, copy, del);
    wrap.appendChild(row);
    box.appendChild(wrap);
  }
}

/* ---------- wiring ---------- */
for (const ex of EXAMPLES) {
  const b = el("button", "", ex.name);
  b.onclick = () => { $("#url").value = ex.url; $("#goal").value = ex.goal; };
  $("#examples").appendChild(b);
}

$("#run").onclick = runAgent;
$("#save").onclick = saveEndpoint;
$("#back").onclick = showBuild;
$("#copy-raw").onclick = async () => {
  await navigator.clipboard.writeText(JSON.stringify(state.data, null, 2));
  const b = $("#copy-raw"); b.textContent = "Copied"; setTimeout(() => (b.textContent = "Copy raw data"), 1200);
};
$("#csv").onclick = () => {
  const rows = findTable(state.data);
  if (!rows) return;
  const blob = new Blob(["\ufeff" + toCSV(rows)], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = (state.name || "results") + ".csv";
  document.body.appendChild(a); a.click(); a.remove();
};
loadEndpoints();
</script>
</body>
</html>
